spring:
  application:
    name: maru
  datasource:
    url: jdbc:postgresql://localhost:5432/maru
    username: hadohadopapi
    password:
  jpa:
    hibernate:
      ddl-auto: update
      format_sql: true
      dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: email, profile
          apple:
            client-id: ${APPLE_CLIENT_ID:dummy-apple-client-id}
            client-secret: ${APPLE_CLIENT_SECRET:dummy-apple-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://appleid.apple.com/auth/userinfo
            user-name-attribute: sub

jwt:
  # Base64 encoded secret key (Must be at least 256 bits / 32 bytes for HS256)
  secret: ${JWT_SECRET:}
  # 24 hours in milliseconds
  expiration-ms: 86400000

gemini:
  api:
    key: ${GEMINI_API_KEY:}

openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: gpt-4o

maru:
  # 웹 체험판. 기본 꺼짐: 꺼져 있으면 게스트 API 는 404, 제한 코드는 통과만 한다 (docs/features/web-demo/API_CONTRACT.md)
  demo:
    enabled: ${MARU_DEMO_ENABLED:false}
    ai-enabled: ${MARU_DEMO_AI_ENABLED:true}
    mission-easy-only: ${MARU_DEMO_MISSION_EASY_ONLY:true}
    guest-token-ttl-ms: ${MARU_DEMO_GUEST_TOKEN_TTL_MS:43200000}
    guest-issue-per-minute: ${MARU_DEMO_GUEST_ISSUE_PER_MINUTE:300}
    mission-starts-per-user: ${MARU_DEMO_MISSION_STARTS_PER_USER:2}
    lab-misses-per-user: ${MARU_DEMO_LAB_MISSES_PER_USER:3}
    tts-misses-per-user: ${MARU_DEMO_TTS_MISSES_PER_USER:15}
    ai-calls-per-user: ${MARU_DEMO_AI_CALLS_PER_USER:60}
    max-concurrent-ai: ${MARU_DEMO_MAX_CONCURRENT_AI:8}
    ai-wait-seconds: ${MARU_DEMO_AI_WAIT_SECONDS:15}
    daily-ai-calls: ${MARU_DEMO_DAILY_AI_CALLS:3000}
  # 기본값이면 CORS 동작은 기존과 동일 (추가 Origin 없음, Access-Control-Max-Age 없음)
  cors:
    extra-origins: ${MARU_CORS_EXTRA_ORIGINS:}
    max-age-seconds: ${MARU_CORS_MAX_AGE_SECONDS:0}
